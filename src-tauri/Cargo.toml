[package]
name = "stattracker"
version = "0.1.2"
description = "Chromeless desktop widget for recording reference desk question tallies"
authors = ["StatTracker"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
auto-launch = "0.5"
tauri = { version = "1.8", features = [
  "updater",
  "macos-private-api",
  "dialog-ask",
  "dialog-message",
  "window-start-dragging",
  "window-set-title",
] }
rfd = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
