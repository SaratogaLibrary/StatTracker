<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vertical template preview</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Preview page only — not used by the widget. */
    html, body {
      font-family: "Segoe UI", "Avenir Next", Calibri, sans-serif;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2.5rem;
      background-color: #5a5854;
      background-image:
        linear-gradient(45deg, #4e4c48 25%, transparent 25%),
        linear-gradient(-45deg, #4e4c48 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #4e4c48 75%),
        linear-gradient(-45deg, transparent 75%, #4e4c48 75%);
      background-size: 1.25rem 1.25rem;
      background-position: 0 0, 0 0.625rem, 0.625rem -0.625rem, -0.625rem 0;
    }
    .preview-label {
      margin: 0 0 1rem;
      color: #f3efe6;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <p class="preview-label">Vertical · static mockup</p>
  <section data-widget class="widget widget--vertical is-ready" aria-label="StatTracker">
    <header class="top">
      <div class="drag" data-tauri-drag-region title="Drag to move">
        <span class="brand" data-slot="title">StatTracker</span>
        <span class="desk" data-slot="desk-name">Main Reading Room</span>
      </div>
      <div class="chrome">
        <button type="button" data-action="always-on-top" aria-pressed="false" title="Always on top">📌</button>
        <button type="button" data-action="cycle-template" title="Toggle template" aria-label="Toggle template">🔁</button>
        <button type="button" data-action="settings" title="Settings">⚙️</button>
        <button type="button" data-action="minimize" title="Minimize" aria-label="Minimize">__</button>
        <button type="button" data-action="close" title="Close" aria-label="Close">✖️</button>
      </div>
    </header>
    <div class="buttons" data-slot="buttons">
      <button type="button" class="tally" data-question-type-id="1" title="Button 1" aria-label="Button 1">
        <span>Button 1</span>
      </button>
      <button type="button" class="tally" data-question-type-id="2" title="Button 2" aria-label="Button 2">
        <span>Button 2</span>
      </button>
      <button type="button" class="tally" data-question-type-id="3" title="Button 3" aria-label="Button 3">
        <span>Button 3</span>
      </button>
    </div>
    <footer class="meta">
      <p class="status" data-slot="status" data-online="true">Online</p>
	  <a class="help" href="#" data-action="help" title="Help" aria-label="Help">Help</a>
      <p class="counter" title="Questions recorded locally today">Today: <span data-slot="counter">12</span></p>
    </footer>
  </section>
</body>
</html>
