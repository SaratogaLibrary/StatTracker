<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{windowTitle}} Info</title>
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/help.css" />
</head>
<body>
  <main class="wrap">
    <h1>{{windowTitle}} Info</h1>
    <p class="lede" id="help-lede">Question types for {{deskName}}. Each name matches a tally button on the widget.</p>

    <output class="status" id="help-status" hidden></output>
    <ul id="help-list" class="help-list"></ul>
  </main>
  <script src="js/help.js"></script>
</body>
</html>
