<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StatTracker</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", "Avenir Next", Calibri, sans-serif;
    }
    #host {
      opacity: 0;
      transition: opacity 800ms ease;
      width: max-content;
      height: max-content;
      zoom: var(--widget-zoom, 1);
    }
    #host.is-visible {
      opacity: var(--dim, 1);
    }
    #host iframe {
      border: 0;
      display: block;
      background: transparent;
      color-scheme: none;
    }
    #tooltip {
      position: fixed;
      z-index: 1000;
      max-width: 18rem;
      padding: 0.5rem 0.7rem;
      border-radius: 0.4rem;
      background: color-mix(in oklab, canvasText 88%, canvas 12%);
      color: canvas;
      font-size: 0.8rem;
      line-height: 1.3;
      pointer-events: none;
      opacity: 0;
      transform: translateY(0.25rem);
      transition: opacity 160ms ease, transform 160ms ease;
    }
    #tooltip.is-shown {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="host"></div>
  <div id="tooltip" role="tooltip"></div>
  <script src="js/bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
